import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.github.gcacace.signaturepad'
    compileSdk Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)

    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles 'proguard-rules-consumer.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding true
    }
}

// Publishing to Maven Central via the Sonatype Central Portal.
//
// The POM metadata (name, description, url, license, developer, scm) is read
// automatically by the vanniktech plugin from the POM_* keys in
// gradle.properties, so it is NOT repeated here.
//
// Coordinates ARE set explicitly so we keep shipping under the exact artifact
// consumers already depend on: `com.github.gcacace:signature-pad`.
// (Do NOT let the plugin derive the artifact id from POM_ARTIFACT_ID — that
//  value is `android-signaturepad`, which was never the published id and would
//  silently break every existing integration.)
mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    coordinates(project.GROUP, 'signature-pad', project.VERSION_NAME)
}
