name: Feature request
description: Suggest an idea or enhancement for the library
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please check
        [existing issues](https://github.com/gcacace/android-signaturepad/issues)
        to see if it has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        A clear description of the problem or limitation you are running into.
        "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — mockups, links, API sketches, etc.
