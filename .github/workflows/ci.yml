name: CI

on:
  push:
    branches: [ master, "revive/**", "release/**" ]
  pull_request:
    branches: [ master ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests + coverage (library)
        run: ./gradlew :signature-pad:jacocoTestReport --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: signature-pad/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Android Lint (library)
        run: ./gradlew :signature-pad:lintRelease --stacktrace

      - name: Assemble library AAR
        run: ./gradlew :signature-pad:assembleRelease --stacktrace

      - name: Assemble example app
        run: ./gradlew :SignaturePad-Example:assembleDebug --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            signature-pad/build/reports/tests/**
            signature-pad/build/reports/lint-results-*.html
          if-no-files-found: ignore
